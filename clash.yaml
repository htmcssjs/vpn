mixed-port: 7897
socks-port: 7898
port: 7899
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false
find-process-mode: always
geox-url:
  geoip: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
geo-auto-update: true
geo-update-interval: 24
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:8888
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - localhost.ptlogin2.qq.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.xboxlive.com
    - xbox.*.microsoft.com
    - "*.battlenet.com.cn"
    - "*.battlenet.com"
    - "*.blzstatic.cn"
    - "*.battle.net"
    - "+.trycloudflare.com"
    - "+.argotunnel.com"
    - "+.tailscale.com"
    - "+.tailscale.io"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "geosite:private":
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://120.53.53.53/dns-query
    "geosite:gfw":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://120.53.53.53/dns-query
p1:
  &a1 {
    type: http,
    interval: 86400,
    health-check:
      {
        enable: true,
        url: https://www.gstatic.com/generate_204,
        interval: 300,
      },
  }
p2: &a2 { type: select, use: [Subscribe] }
p3:
  &a3 {
    type: select,
    proxies:
      [
        🛸 节点选择,
        🚀 手动切换,
        ♻️ 自动选择,
        🇭🇰 香港节点,
        🇹🇼 台湾节点,
        🇯🇵 日本节点,
        🇸🇬 狮城节点,
        🇺🇸 美国节点,
        🇩🇪 德国节点,
        🇫🇷 法国节点,
        DIRECT,
      ],
  }
p4:
  &a4 {
    type: url-test,
    lazy: true,
    url: https://www.gstatic.com/generate_204,
    interval: 300,
    tolerance: 100,
    use: [Subscribe],
  }
p5: &a5 { type: http, behavior: domain, interval: 86400 }
p6: &a6 { type: http, behavior: classical, interval: 86400 }
proxy-providers:
  Subscribe:
    <<: *a1
    url: "请手动填入你的订阅"
    path: ./proxy_providers/tmp.yaml
proxies: []
proxy-groups:
  - {
      name: 🛸 节点选择,
      type: select,
      proxies:
        [
          🚀 手动切换,
          ♻️ 自动选择,
          🇭🇰 香港节点,
          🇹🇼 台湾节点,
          🇯🇵 日本节点,
          🇸🇬 狮城节点,
          🇺🇸 美国节点,
          🇩🇪 德国节点,
          🇫🇷 法国节点,
          DIRECT,
        ],
    }
  - { name: 🚀 手动切换, <<: *a2 }
  - { name: ♻️ 自动选择, <<: *a4 }
  - { name: 🆎 AdBlock, type: select, proxies: [REJECT, DIRECT] }
  - {
      name: 🤖 AI,
      type: select,
      proxies:
        [🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇸 美国节点, 🇩🇪 德国节点, 🇫🇷 法国节点],
    }
  - {
      name: 📺 哔哩哔哩,
      type: select,
      proxies: [DIRECT, 🇭🇰 香港节点, 🇹🇼 台湾节点],
    }
  - { name: 🎬 国际媒体, <<: *a3 }
  - { name: 🍎 苹果服务, <<: *a3 }
  - { name: 🌏 全球加速, <<: *a3 }
  - { name: 🌌 谷歌服务, <<: *a3 }
  - { name: 📟 电报消息, <<: *a3 }
  - { name: 🎮 游戏平台, <<: *a3 }
  - { name: 🐟 兜底分流, <<: *a3 }
  - { name: 🇭🇰 香港节点, <<: *a4, filter: "港|HK|(?i)Hong" }
  - { name: 🇹🇼 台湾节点, <<: *a4, filter: "台|湾|TW|(?i)Taiwan" }
  - { name: 🇯🇵 日本节点, <<: *a4, filter: "日|东京|JP|(?i)Japan" }
  - {
      name: 🇸🇬 狮城节点,
      <<: *a4,
      filter: "新|坡|SG|(?i)Singapore",
      exclude-filter: "新西兰|NZ",
    }
  - {
      name: 🇺🇸 美国节点,
      <<: *a4,
      filter: "美|US|(?i)States|American",
      exclude-filter: "澳|俄|AUS|RUS",
    }
  - { name: 🇩🇪 德国节点, <<: *a4, filter: "德|DE|(?i)Germany" }
  - {
      name: 🇫🇷 法国节点,
      <<: *a4,
      filter: "法|FR|(?i)France",
      exclude-filter: "法兰克福",
    }
rule-providers:
  Direct:
    {
      <<: *a6,
      url: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Direct/Direct.yaml,
